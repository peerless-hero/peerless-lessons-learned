name: Deploy to EdgeOne Makers

on:
  push:
    branches:
      - main          # 主分支推送时触发\
  workflow_dispatch:   # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v6

      # 2. 安装 Node.js（按你的项目版本调整）
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'yarn'

      # 3. 安装依赖
      - name: Install dependencies
        run: yarn --frozen-lockfile

      # 4. 构建项目（按你的构建命令调整）
      - name: Build
        run: yarn build

      # 5. 将 edgeone.json 复制到构建输出目录
      - name: Copy edgeone.json
        run: cp edgeone.json ./dist/edgeone.json

      # 6. 部署到 EdgeOne Makers
      - name: Deploy to EdgeOne
        run: |
          npx edgeone makers deploy ./dist \
            -n ${{ secrets.EDGEONE_NAME }} \
            -t ${{ secrets.EDGEONE_API_TOKEN }} \
            -e production
